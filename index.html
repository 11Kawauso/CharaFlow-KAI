<title>おおもじボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* 1カラムの操作パネル。入力 → 見本 → 定型文 → 設定 の順に、上から使う頻度順で並べる */
:root{
  --bg:#eef1ee; --surface:#ffffff; --fg:#1b2420; --muted:#5b6762; --line:#d6ddd8;
  --accent:#1d5c48; --accent-fg:#ffffff; --chip:#e3ebe6; --danger:#a33a2a;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1b2220; --fg:#e8eeeb; --muted:#9aa8a2; --line:#2e3935;
  --accent:#5fc1a0; --accent-fg:#0d1a15; --chip:#24302c; --danger:#e88a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1b2220; --fg:#e8eeeb; --muted:#9aa8a2; --line:#2e3935;
  --accent:#5fc1a0; --accent-fg:#0d1a15; --chip:#24302c; --danger:#e88a7a; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
h1{font-size:1.35rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--muted);letter-spacing:0}
h2{font-size:.78rem;margin:0 0 8px;color:var(--muted);letter-spacing:.08em;font-weight:700}
section{display:flex;flex-direction:column;gap:10px}

textarea{width:100%;box-sizing:border-box;min-height:7.5em;resize:vertical;font:inherit;font-size:1.15rem;
  padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
textarea:focus-visible{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;font-size:1.15rem;flex:1;padding:14px}
.mic{display:flex;align-items:center;gap:6px;font-weight:700;padding:14px 16px}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--danger);border-color:var(--danger);color:#fff}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.hint.warn{color:var(--danger)}

.sample{border-radius:14px;min-height:96px;display:flex;align-items:center;justify-content:center;padding:14px;
  text-align:center;font-size:2rem;line-height:1.25;overflow-wrap:anywhere;border:2px solid var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-color:transparent;padding:10px 14px;font-size:1rem;position:relative}
.chip .x{display:none;margin-left:8px;color:var(--danger);font-weight:700}
.editing .chip .x{display:inline}
.linkbtn{border:none;background:none;color:var(--accent);padding:4px 2px;font-size:.9rem;text-decoration:underline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:.9rem;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;font-size:.95rem}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
input[type=range]{width:100%;accent-color:var(--accent)}
.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{height:52px;border-radius:10px;font-weight:700;font-size:1.1rem;padding:0;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.pickers{display:flex;gap:16px;flex-wrap:wrap}
.pickers label{display:flex;align-items:center;gap:8px;font-size:.9rem}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.check{display:flex;align-items:center;gap:8px;font-size:.95rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* 表示画面 */
#stage{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column}
#stage[hidden]{display:none!important}
/* 縦持ちのまま開いたときは、画面ごと90度回して横向きレイアウトにする */
#stage.rot{inset:auto;top:0;left:0;width:100vh;height:100vw;width:100dvh;height:100dvw;
  transform-origin:top left;transform:translateX(100vw) rotate(90deg)}
.board{flex:1;position:relative;overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.board.flip{transform:rotate(180deg)}
.fitbox{position:absolute;inset:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:center}
#txt{margin:0;text-align:center;line-height:1.28;overflow-wrap:anywhere;white-space:pre-wrap}
.scroll #txt{position:absolute;left:0;top:50%;white-space:nowrap;text-align:left;will-change:transform}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px));
  background:rgba(127,127,127,.18)}
.bar button{background:rgba(255,255,255,.14);color:inherit;border-color:rgba(127,127,127,.5);font-size:1rem;padding:10px 16px}
.bar button.on{background:#c0392b;border-color:#c0392b;color:#fff}
.bar .close{font-weight:700}
@media (prefers-reduced-motion: reduce){ .scroll #txt{animation:none} }
</style>

<div class="wrap">
  <h1>おおもじボード<small>打った言葉・話した言葉を、画面いっぱいの大きな文字で見せる</small></h1>

  <section>
    <textarea id="input" placeholder="ここに言葉を入力（Enterで表示）" enterkeyhint="done">ごはんできたよー！</textarea>
    <div class="row">
      <button class="mic" id="micBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span id="micLabel">話す</span>
      </button>
      <button class="primary" id="showBtn" type="button">大きく表示</button>
    </div>
    <p class="hint" id="micHint">「話す」で音声入力。使えない環境では、キーボードのマイクボタンで話しても入力できます。</p>
  </section>

  <section>
    <h2>見本</h2>
    <div class="sample" id="sample">ごはんできたよー！</div>
  </section>

  <section>
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">よく使う言葉</h2>
      <div class="row" style="gap:4px">
        <button class="linkbtn" id="addPhrase" type="button">いまの文を登録</button>
        <button class="linkbtn" id="editPhrase" type="button">編集</button>
      </div>
    </div>
    <div class="chips" id="phrases"></div>
  </section>

  <section id="histSec">
    <h2>さっき見せた言葉</h2>
    <div class="chips" id="history"></div>
  </section>

  <section>
    <h2>表示の設定</h2>
    <div class="panel">
      <div class="field">
        <span class="lbl">表示のしかた</span>
        <div class="seg" id="modeSeg">
          <button type="button" data-v="fit">画面に収めて全文</button>
          <button type="button" data-v="scroll">横に流す</button>
        </div>
      </div>
      <div class="field">
        <label for="size">文字の大きさ <span id="sizeVal"></span></label>
        <input type="range" id="size" min="20" max="100" step="5">
      </div>
      <div class="field" id="speedField">
        <label for="speed">流れる速さ <span id="speedVal"></span></label>
        <input type="range" id="speed" min="1" max="5" step="1">
      </div>
      <div class="field">
        <span class="lbl">フォント</span>
        <div class="seg" id="fontSeg">
          <button type="button" data-v="gothic">UDゴシック</button>
          <button type="button" data-v="mincho">UD明朝</button>
          <button type="button" data-v="maru">丸ゴシック</button>
        </div>
        <label class="check"><input type="checkbox" id="bold"> 太字</label>
      </div>
      <div class="field">
        <span class="lbl">色</span>
        <div class="colors" id="colorSeg"></div>
        <div class="pickers">
          <label>文字色 <input type="color" id="fg"></label>
          <label>背景色 <input type="color" id="bg"></label>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="land"> 横向きで表示（スマホを横にして見せる）</label>
      <label class="check"><input type="checkbox" id="flip"> 上下反転で表示（向かいの人に見せる用）</label>
    </div>
  </section>
</div>

<div id="stage" hidden>
  <div class="board" id="board">
    <div class="fitbox" id="fitbox"><p id="txt"></p></div>
  </div>
  <div class="bar">
    <button type="button" id="stMic">話す</button>
    <button type="button" id="stLand">縦にする</button>
    <button type="button" id="stFlip">反転</button>
    <button type="button" id="stMode">流す</button>
    <button type="button" class="close" id="stClose">閉じる</button>
  </div>
</div>

<script>
(() => {
  const FONTS = {
    gothic: '"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif',
    mincho: '"BIZ UDPMincho","Hiragino Mincho ProN","Noto Serif JP",serif',
    maru:   '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif'
  };
  const PRESETS = [
    {bg:'#000000', fg:'#ffe600'}, {bg:'#000000', fg:'#ffffff'},
    {bg:'#ffffff', fg:'#111111'}, {bg:'#0b2a4a', fg:'#ffffff'}
  ];
  const DEFAULTS = {
    mode:'fit', size:70, speed:3, font:'gothic', bold:true, fg:'#ffe600', bg:'#000000', flip:false, land:true,
    phrases:['ごはんできたよー！','お風呂わいたよ','電話だよ','ちょっと出かけてくるね','何か飲む？','もう一回言うね'],
    history:[]
  };
  const KEY = 'oomoji-v1';
  let S = {...DEFAULTS};
  try { const raw = localStorage.getItem(KEY); if (raw) S = {...DEFAULTS, ...JSON.parse(raw)}; } catch(e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };

  const $ = id => document.getElementById(id);
  const input = $('input'), sample = $('sample'), stage = $('stage'), board = $('board'),
        fitbox = $('fitbox'), txt = $('txt');

  /* ---------- 設定 UI ---------- */
  function segBind(segId, key) {
    const seg = $(segId);
    seg.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      S[key] = b.dataset.v; save(); syncUI();
    });
  }
  segBind('modeSeg','mode'); segBind('fontSeg','font');

  const colorSeg = $('colorSeg');
  PRESETS.forEach((p,i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.textContent = 'あ';
    b.style.background = p.bg; b.style.color = p.fg; b.dataset.i = i;
    b.setAttribute('aria-label', '配色 ' + (i+1));
    b.onclick = () => { S.bg = p.bg; S.fg = p.fg; save(); syncUI(); };
    colorSeg.appendChild(b);
  });

  $('size').oninput = e => { S.size = +e.target.value; save(); syncUI(); };
  $('speed').oninput = e => { S.speed = +e.target.value; save(); syncUI(); };
  $('bold').onchange = e => { S.bold = e.target.checked; save(); syncUI(); };
  $('flip').onchange = e => { S.flip = e.target.checked; save(); syncUI(); };
  $('land').onchange = e => { S.land = e.target.checked; save(); syncUI(); };
  $('fg').oninput = e => { S.fg = e.target.value; save(); syncUI(); };
  $('bg').oninput = e => { S.bg = e.target.value; save(); syncUI(); };

  function applyLook(el) {
    el.style.background = S.bg; el.style.color = S.fg;
    el.style.fontFamily = FONTS[S.font]; el.style.fontWeight = S.bold ? (S.font === 'maru' ? 800 : 700) : (S.font === 'maru' ? 500 : 400);
  }

  function syncUI() {
    document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.mode));
    document.querySelectorAll('#fontSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.font));
    document.querySelectorAll('#colorSeg .sw').forEach(b => {
      const p = PRESETS[b.dataset.i]; b.setAttribute('aria-pressed', p.bg === S.bg && p.fg === S.fg);
    });
    $('size').value = S.size; $('sizeVal').textContent = S.size + '%';
    $('speed').value = S.speed; $('speedVal').textContent = ['','ゆっくり','やや遅い','ふつう','やや速い','速い'][S.speed];
    $('speedField').hidden = S.mode !== 'scroll';
    $('bold').checked = S.bold; $('flip').checked = S.flip; $('land').checked = S.land;
    $('stLand').textContent = S.land ? '縦にする' : '横にする';
    $('fg').value = S.fg; $('bg').value = S.bg;
    applyLook(sample);
    sample.textContent = input.value.trim() || '見本';
    $('stMode').textContent = S.mode === 'scroll' ? '全文表示' : '流す';
    $('stFlip').classList.toggle('on', S.flip);
    if (!stage.hidden) render();
  }

  /* ---------- 定型文と履歴 ---------- */
  let editing = false;
  function renderChips() {
    const wrap = $('phrases'); wrap.innerHTML = '';
    wrap.classList.toggle('editing', editing);
    S.phrases.forEach((p, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.append(p);
      const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; b.append(x);
      b.onclick = () => {
        if (editing) { S.phrases.splice(i,1); save(); renderChips(); }
        else { input.value = p; show(); }
      };
      wrap.appendChild(b);
    });
    $('editPhrase').textContent = editing ? '完了' : '編集';

    const h = $('history'); h.innerHTML = '';
    $('histSec').hidden = !S.history.length;
    S.history.forEach(p => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = p.length > 18 ? p.slice(0,18) + '…' : p;
      b.onclick = () => { input.value = p; show(); };
      h.appendChild(b);
    });
  }
  $('addPhrase').onclick = () => {
    const v = input.value.trim(); if (!v || S.phrases.includes(v)) return;
    S.phrases.push(v); save(); renderChips();
  };
  $('editPhrase').onclick = () => { editing = !editing; renderChips(); };

  /* ---------- 表示 ---------- */
  let anim = null, wakeLock = null;

  function render() {
    applyLook(stage);
    // 横向き設定で、画面がまだ縦長なら90度回して表示
    stage.classList.toggle('rot', S.land && innerHeight > innerWidth);
    board.classList.toggle('flip', S.flip);
    board.classList.toggle('scroll', S.mode === 'scroll');
    const text = input.value.trim() || ' ';
    txt.textContent = S.mode === 'scroll' ? text.replace(/\s*\n\s*/g, '　') : text;
    if (anim) { anim.cancel(); anim = null; }
    txt.style.transform = '';
    const W = fitbox.clientWidth, H = fitbox.clientHeight;
    if (!W || !H) return;

    if (S.mode === 'scroll') {
      const fs = Math.max(24, H * S.size / 100 * 0.8);
      txt.style.fontSize = fs + 'px';
      txt.style.marginTop = (-txt.offsetHeight / 2) + 'px';
      const w = txt.scrollWidth;
      const pxPerSec = W * (0.12 + S.speed * 0.07);
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { txt.style.transform = 'translateX(0)'; return; }
      anim = txt.animate(
        [{transform:`translateX(${W}px)`},{transform:`translateX(${-w}px)`}],
        {duration: (W + w) / pxPerSec * 1000, iterations: Infinity}
      );
    } else {
      txt.style.marginTop = '';
      let lo = 12, hi = Math.max(16, H * S.size / 100), best = lo;
      for (let i = 0; i < 18; i++) {
        const mid = (lo + hi) / 2;
        txt.style.fontSize = mid + 'px';
        if (txt.scrollHeight <= H && txt.scrollWidth <= W) { best = mid; lo = mid; } else { hi = mid; }
      }
      txt.style.fontSize = Math.floor(best) + 'px';
    }
  }

  async function show() {
    const v = input.value.trim(); if (!v) { input.focus(); return; }
    S.history = [v, ...S.history.filter(h => h !== v)].slice(0, 8); save(); renderChips();
    syncUI();
    stage.hidden = false;
    try { await document.documentElement.requestFullscreen?.(); } catch(e) {}
    if (S.land) { try { await screen.orientation?.lock?.('landscape'); } catch(e) {} }
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e) {}
    requestAnimationFrame(render);
  }
  async function hide() {
    stage.hidden = true;
    if (anim) { anim.cancel(); anim = null; }
    stage.classList.remove('rot');
    try { screen.orientation?.unlock?.(); } catch(e) {}
    try { if (document.fullscreenElement) await document.exitFullscreen(); } catch(e) {}
    try { await wakeLock?.release(); } catch(e) {} wakeLock = null;
  }

  $('showBtn').onclick = show;
  $('stClose').onclick = hide;
  board.onclick = hide;
  $('stLand').onclick = async () => {
    S.land = !S.land; save();
    try { S.land ? await screen.orientation?.lock?.('landscape') : screen.orientation?.unlock?.(); } catch(e) {}
    syncUI();
  };
  $('stFlip').onclick = () => { S.flip = !S.flip; save(); syncUI(); };
  $('stMode').onclick = () => { S.mode = S.mode === 'scroll' ? 'fit' : 'scroll'; save(); syncUI(); };
  input.addEventListener('input', () => { sample.textContent = input.value.trim() || '見本'; if (!stage.hidden) render(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); show(); }
  });
  addEventListener('resize', () => { if (!stage.hidden) render(); });
  document.addEventListener('visibilitychange', async () => {
    if (!stage.hidden && document.visibilityState === 'visible') {
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e) {}
    }
  });

  /* ---------- 音声入力 ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, base = '';
  const hint = $('micHint');

  function setListening(on) {
    listening = on;
    $('micBtn').classList.toggle('on', on); $('micBtn').setAttribute('aria-pressed', on);
    $('micLabel').textContent = on ? '止める' : '話す';
    $('stMic').classList.toggle('on', on); $('stMic').textContent = on ? '止める' : '話す';
  }
  function micUnavailable() {
    hint.classList.add('warn');
    hint.textContent = 'ここではマイクが使えません。スマホのキーボードのマイクボタンで話すと、入力欄に文字が入ります。';
    input.focus();
  }
  function toggleMic() {
    if (listening) { rec?.stop(); return; }
    if (!SR) { micUnavailable(); return; }
    try {
      rec = new SR();
      rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = true;
      base = '';
      let finals = '';
      rec.onresult = e => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) finals += t; else interim += t;
        }
        input.value = base + finals + interim;
        sample.textContent = input.value || '見本';
        if (!stage.hidden) render();
      };
      rec.onerror = e => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') micUnavailable();
      };
      rec.onend = () => setListening(false);
      rec.start();
      setListening(true);
      hint.classList.remove('warn');
      hint.textContent = '聞き取り中…話した言葉がそのまま入ります。';
    } catch (err) { setListening(false); micUnavailable(); }
  }
  $('micBtn').onclick = toggleMic;
  $('stMic').onclick = toggleMic;

  renderChips(); syncUI();
})();
</script>
