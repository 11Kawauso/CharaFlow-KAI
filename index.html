<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おおもじボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="oomoji.css">
</head>
<body>
<div class="wrap">
  <h1>おおもじボード<small>打った言葉・話した言葉を、画面いっぱいの大きな文字で見せる</small></h1>

  <section>
    <textarea id="input" placeholder="ここに言葉を入力（Enterで表示）" enterkeyhint="done">ごはんできたよー！</textarea>
    <div class="row">
      <button class="mic" id="micBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span id="micLabel">話す</span>
      </button>
      <button id="clearBtn" type="button">消す</button>
      <button class="primary" id="showBtn" type="button">大きく表示</button>
    </div>
    <p class="hint" id="micHint">「話す」で音声入力。使えない環境では、キーボードのマイクボタンで話しても入力できます。</p>
  </section>

  <section>
    <h2>見本</h2>
    <div class="sample" id="sample">ごはんできたよー！</div>
  </section>

  <section>
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">よく使う言葉</h2>
      <div class="row" style="gap:4px">
        <button class="linkbtn" id="addPhrase" type="button">いまの文を登録</button>
        <button class="linkbtn" id="editPhrase" type="button">編集</button>
      </div>
    </div>
    <div class="chips" id="phrases"></div>
  </section>

  <section>
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">画像</h2>
      <button class="linkbtn" id="editPics" type="button" hidden>編集</button>
    </div>
    <div class="tiles" id="pics"></div>
    <input type="file" id="picFile" accept="image/*" multiple hidden>
    <p class="hint">画像をタップすると、入力欄に「［画像1］」のように入ります。画像だけ、または「こんにちは［画像1］」のように文字と一緒に見せられます。</p>
  </section>

  <section id="histSec">
    <h2>さっき見せた言葉</h2>
    <div class="chips" id="history"></div>
  </section>

  <section>
    <h2>表示の設定</h2>
    <div class="panel">
      <div class="field">
        <span class="lbl">表示のしかた</span>
        <div class="seg" id="modeSeg">
          <button type="button" data-v="fit">画面に収めて全文</button>
          <button type="button" data-v="scroll">横に流す</button>
        </div>
      </div>
      <div class="field">
        <label for="size">文字の大きさ <span id="sizeVal"></span></label>
        <input type="range" id="size" min="20" max="100" step="5">
      </div>
      <div class="field" id="speedField">
        <label for="speed">流れる速さ <span id="speedVal"></span></label>
        <input type="range" id="speed" min="1" max="5" step="1">
      </div>
      <div class="field">
        <span class="lbl">フォント</span>
        <div class="seg" id="fontSeg">
          <button type="button" data-v="gothic">UDゴシック</button>
          <button type="button" data-v="mincho">UD明朝</button>
          <button type="button" data-v="maru">丸ゴシック</button>
        </div>
        <label class="check"><input type="checkbox" id="bold"> 太字</label>
      </div>
      <div class="field">
        <span class="lbl">色</span>
        <div class="colors" id="colorSeg"></div>
        <div class="pickers">
          <label>文字色 <input type="color" id="fg"></label>
          <label>背景色 <input type="color" id="bg"></label>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="land"> 横向きで表示（スマホを横にして見せる）</label>
      <label class="check"><input type="checkbox" id="flip"> 上下反転で表示（向かいの人に見せる用）</label>
    </div>
  </section>
</div>

<div id="stage" hidden>
  <div class="board" id="board">
    <div class="fitbox" id="fitbox"><p id="txt"></p></div>
  </div>
  <div class="bar">
    <button type="button" id="stMic">話す</button>
    <button type="button" id="stLand">縦にする</button>
    <button type="button" id="stFlip">反転</button>
    <button type="button" id="stMode">流す</button>
    <button type="button" class="close" id="stClose">閉じる</button>
  </div>
</div>

<script src="oomoji.js"></script>
</body>
</html>
